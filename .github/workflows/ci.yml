name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forwardx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          blocked_paths="$(git ls-files | grep -E '(^|/)(\.env([^/]*)?|vps[^/]*\.txt|AGENTS\.md|CLAUDE\.md|tasks/.*|android/app/keystore/.*|[^/]*\.(p12|pfx|jks|keystore|pem|key|db|sqlite|sqlite3))$' | grep -Ev '(^|/)\.env(\.[^/]*)?\.example$|(^|/)\.env\.example$' || true)"
          if [ -n "$blocked_paths" ]; then
            echo "Forbidden sensitive or local-only paths are tracked:"
            printf '%s\n' "$blocked_paths"
            exit 1
          fi
          if git grep -n -E 'raw\.githubusercontent\.com/poouo/Forwardx|ghcr\.io/poouo/forwardx' -- .; then
            echo "Upstream operational download target detected."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            agent/go.mod
            forwardx-fxp/go.mod
            forwardx-fxp/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify panel
        run: |
          pnpm check:versions
          pnpm exec tsc --noEmit
          node --import tsx --test server/agentCrypto.test.ts
          pnpm test:server
          pnpm build
          pnpm docs:build

      - name: Verify Agent and FXP
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)
